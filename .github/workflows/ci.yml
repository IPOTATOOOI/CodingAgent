name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装 Linux GUI 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1
      - name: 安装项目
        run: python -m pip install -e ".[test]"
      - name: 运行单元测试
        run: python -m unittest discover -s tests -v
      - name: 检查 Python 语法
        run: python -m compileall -q src tests eval
      - name: 检查包版本一致性
        run: python -c "import coding_agent, importlib.metadata; assert coding_agent.__version__ == importlib.metadata.version('mini-coding-agent')"
